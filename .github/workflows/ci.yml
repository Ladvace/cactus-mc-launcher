name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  rust:
    name: Build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked --bin cactus-launcher
