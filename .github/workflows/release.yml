name: Release

# Build, sign, notarize and publish installers on a semver tag:
#   git tag v1.12.0 && git push origin v1.12.0
# The tag must match `version` in Cargo.toml. Assets land in a draft release; publish it to
# ship (the updater reads releases/latest, so drafts reach nobody).
#
# Secrets (the same ones the Tauri pipeline used):
#   TAURI_SIGNING_PRIVATE_KEY(_PASSWORD)  minisign key the updater trusts (pubkey in updater.rs)
#   APPLE_CERTIFICATE(_PASSWORD), APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   AZURE_CLIENT_ID, CACTUS_API_BASE      baked in at build time (build.rs); empty disables
on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            formats: app,dmg
            platform: macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            formats: app,dmg
            platform: macos-x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
            platform: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      CACTUS_API_BASE: ${{ secrets.CACTUS_API_BASE }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libwayland-dev libxkbcommon-dev libfuse2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      # Kept out of the repo; written under [package.metadata.packager.macos] for this build.
      - name: Signing identity (macOS)
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        run: |
          python3 - <<'EOF'
          import os
          s = open("Cargo.toml").read()
          head = "[package.metadata.packager.macos]\n"
          assert head in s
          line = 'signing-identity = "%s"\n' % os.environ["APPLE_SIGNING_IDENTITY"]
          open("Cargo.toml", "w").write(s.replace(head, head + line, 1))
          EOF

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Package and sign
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cargo packager --release --target "$TARGET" --formats ${{ matrix.formats }} \
            --binaries-dir "target/$TARGET/release" --out-dir dist

      # Space-free, per-arch names (GitHub turns spaces into dots, and both Macs make the same
      # "Cactus Launcher.app.tar.gz"), and the update entry for latest.json.
      - name: Collect assets
        run: |
          arch="${TARGET%%-*}"
          mkdir -p out
          shopt -s nullglob
          for f in dist/*.dmg dist/*.deb dist/*.AppImage dist/*.AppImage.sig dist/*-setup.exe dist/*-setup.exe.sig; do
            cp "$f" "out/$(basename "$f" | tr ' ' '-')"
          done
          if [ -f "dist/Cactus Launcher.app.tar.gz" ]; then
            cp "dist/Cactus Launcher.app.tar.gz" "out/Cactus-Launcher_${VERSION}_${arch}.app.tar.gz"
            cp "dist/Cactus Launcher.app.tar.gz.sig" "out/Cactus-Launcher_${VERSION}_${arch}.app.tar.gz.sig"
          fi
          case "${{ matrix.platform }}" in
            macos-*) update=$(ls out/*.app.tar.gz); format=app ;;
            linux-*) update=$(ls out/*.AppImage); format=appimage ;;
            windows-*) update=$(ls out/*-setup.exe); format=nsis ;;
          esac
          name=$(basename "$update")
          sig=$(cat "$update.sig")
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$name"
          printf '{"platform":"%s","url":"%s","signature":"%s","format":"%s"}\n' \
            "${{ matrix.platform }}" "$url" "$sig" "$format" > "update-${{ matrix.platform }}.json"
          ls -la out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Cactus Launcher ${{ github.ref_name }}
          draft: true
          files: out/*

      - uses: actions/upload-artifact@v4
        with:
          name: update-${{ matrix.platform }}
          path: update-${{ matrix.platform }}.json

  # One latest.json for every client: `macos-*` entries for this app's updater, and `darwin-*`
  # copies for installs still on the Tauri build, whose updater then moves them onto this one.
  # Every entry carries `format` (this updater requires it; Tauri's ignores it).
  manifest:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: update-*
          merge-multiple: true
      - name: Write latest.json
        run: |
          python3 - <<'EOF'
          import glob, json, os, datetime
          platforms = {}
          for path in glob.glob("update-*.json"):
              e = json.load(open(path))
              entry = {"url": e["url"], "signature": e["signature"], "format": e["format"]}
              platforms[e["platform"]] = entry
              if e["platform"].startswith("macos-"):
                  platforms["darwin-" + e["platform"].split("-", 1)[1]] = entry
          manifest = {
              "version": os.environ["GITHUB_REF_NAME"].lstrip("v"),
              "notes": "See the changelog: https://github.com/%s/blob/master/CHANGELOG.md" % os.environ["GITHUB_REPOSITORY"],
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          json.dump(manifest, open("latest.json", "w"), indent=2)
          print(json.dumps(manifest, indent=2))
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: latest.json
